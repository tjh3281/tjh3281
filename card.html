<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tjh3281 — dev card</title>
<style>
  :root { --gold-1:#f7e6a2; --gold-2:#e6c25c; --gold-3:#c99b2e; --ink:#4a3608; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:transparent; }
  body { display:flex; align-items:center; justify-content:center; padding:40px;
         font-family:"Arial Narrow","Oswald",Impact,sans-serif; }

  .card {
    position:relative;
    width:340px; height:540px;
    padding:26px 24px 22px;
    background:linear-gradient(155deg,var(--gold-1) 0%,var(--gold-2) 40%,var(--gold-3) 100%);
    clip-path:polygon(0 12%,14% 0,86% 0,100% 12%,100% 66%,50% 100%,0 66%);
    color:var(--ink);
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  /* subtle inner sheen */
  .card::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(115deg,rgba(255,255,255,.35),rgba(255,255,255,0) 42%);
    clip-path:inherit; pointer-events:none;
  }

  .top { display:flex; gap:10px; }

  .rating { display:flex; flex-direction:column; align-items:center; width:74px; padding-top:8px; }
  .ovr { font-size:52px; line-height:.9; font-weight:700; letter-spacing:-1px; }
  .pos { font-size:20px; font-weight:700; letter-spacing:1px; margin-top:2px; }
  .rule { width:38px; height:2px; background:var(--ink); opacity:.55; margin:8px 0; }
  .crest { width:46px; height:46px; display:flex; align-items:center; justify-content:center; margin-top:4px; }
  .crest img { max-width:100%; max-height:100%; object-fit:contain;
               filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)); }

  .portrait { flex:1; display:flex; align-items:flex-start; justify-content:center; padding-top:4px; }
  .portrait .frame {
    width:196px; height:196px; border-radius:50%; overflow:hidden;
    border:3px solid rgba(74,54,8,.55);
    box-shadow:inset 0 0 0 4px rgba(255,255,255,.35), 0 6px 16px rgba(0,0,0,.3);
    background:#fff;
  }
  .portrait img { width:100%; height:100%; object-fit:cover; object-position:center 18%; }

  .name {
    text-align:center; font-size:30px; font-weight:700; letter-spacing:1px;
    text-transform:uppercase; margin:14px 0 10px;
    border-bottom:2px solid rgba(74,54,8,.5); padding-bottom:10px;
  }

  .stats { display:flex; justify-content:center; gap:20px; padding:0 6px; }
  .col { display:flex; flex-direction:column; gap:9px; }
  .stat { font-size:20px; font-weight:700; letter-spacing:.5px; white-space:nowrap; }
  .stat b { font-size:21px; margin-right:8px; }
  .vrule { width:2px; background:rgba(74,54,8,.4); align-self:stretch; }

  .foot { position:absolute; left:0; right:0; bottom:70px; text-align:center;
          font-size:12px; letter-spacing:3px; font-weight:700; opacity:.7; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="top">
      <div class="rating">
        <span class="ovr">83</span>
        <span class="pos">DEV</span>
        <span class="rule"></span>
        <span class="crest"><img src="assets/um-logo.png" alt="nation"></span>
        <span class="crest"><img src="assets/um-logo.png" alt="club"></span>
      </div>
      <div class="portrait">
        <div class="frame"><img src="assets/photo.jpg" alt="Teoh Jun Hong"></div>
      </div>
    </div>

    <div class="name">Teoh Jun Hong</div>

    <div class="stats">
      <div class="col">
        <div class="stat"><b>85</b>JAV</div>
        <div class="stat"><b>82</b>PRB</div>
        <div class="stat"><b>74</b>WEB</div>
      </div>
      <div class="vrule"></div>
      <div class="col">
        <div class="stat"><b>70</b>PYT</div>
        <div class="stat"><b>80</b>NET</div>
        <div class="stat"><b>88</b>GRT</div>
      </div>
    </div>
  </div>
</body>
</html>
