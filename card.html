<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tjh3281 — dev card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap');

  :root { --ink:#3a2b06; --ink-soft:#6a541a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:transparent; }
  body { display:flex; align-items:center; justify-content:center; padding:44px;
         font-family:"Oswald",sans-serif; }

  .card {
    position:relative;
    width:372px; height:588px;
    clip-path:url(#fut);
    background:
      radial-gradient(115% 70% at 63% 24%, rgba(255,255,255,.62), rgba(255,255,255,0) 46%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, rgba(0,0,0,.03) 2px 4px),
      linear-gradient(180deg,#f3e09a 0%,#e7cd74 26%,#dcbd5c 50%,#e9d283 51%,#dcbe61 78%,#cfae4f 100%);
    color:var(--ink);
    filter:drop-shadow(0 22px 40px rgba(0,0,0,.42));
  }
  /* top gloss */
  .card::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(120deg,rgba(255,255,255,.4),rgba(255,255,255,0) 34%);
    pointer-events:none;
  }

  .player{
    position:absolute; top:4%; right:-2%; width:72%; z-index:1;
    -webkit-mask-image:linear-gradient(180deg,#000 54%,transparent 74%);
            mask-image:linear-gradient(180deg,#000 54%,transparent 74%);
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));
  }
  .player img{ width:100%; display:block; }

  .rating{
    position:absolute; top:8.5%; left:10%; z-index:3;
    display:flex; flex-direction:column; align-items:center; width:66px;
  }
  .ovr{ font-weight:700; font-size:62px; line-height:.82; }
  .pos{ font-weight:600; font-size:23px; letter-spacing:1px; margin-top:1px; }
  .rule{ width:34px; height:2px; background:var(--ink); opacity:.55; margin:9px 0 8px; }
  .flag{ width:52px; height:52px; display:flex; align-items:center; justify-content:center; }
  .flag img{ max-width:100%; max-height:100%; object-fit:contain;
             filter:drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
  .flag + .flag{ margin-top:8px; }
  .nation img{ border-radius:3px; box-shadow:0 1px 3px rgba(0,0,0,.35); }

  .name{
    position:absolute; top:57%; left:0; right:0; z-index:3; text-align:center;
    font-weight:700; font-size:35px; letter-spacing:1.5px; text-transform:uppercase;
  }
  .name::after{
    content:""; display:block; width:60%; height:2px; margin:9px auto 0;
    background:linear-gradient(90deg,transparent,var(--ink) 20%,var(--ink) 80%,transparent);
    opacity:.55;
  }

  .stats{
    position:absolute; top:68%; left:0; right:0; z-index:3;
    display:flex; justify-content:center; gap:26px;
  }
  .col{ display:flex; flex-direction:column; gap:11px; }
  .stat{ font-size:26px; line-height:1; white-space:nowrap; }
  .stat b{ font-weight:700; }
  .stat span{ font-weight:500; color:var(--ink-soft); margin-left:9px; }
  .vrule{ width:2px; background:var(--ink); opacity:.35; }

  .foot{
    position:absolute; bottom:8%; left:0; right:0; z-index:3; text-align:center;
    font-weight:600; font-size:14px; letter-spacing:2px; opacity:.6;
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <clipPath id="fut" clipPathUnits="objectBoundingBox">
        <path d="M0.055,0.11 C0.055,0.045 0.095,0.028 0.155,0.028 L0.31,0.028
                 C0.365,0.028 0.41,0.055 0.45,0.075 C0.475,0.088 0.525,0.088 0.55,0.075
                 C0.59,0.055 0.635,0.028 0.69,0.028 L0.845,0.028
                 C0.905,0.028 0.945,0.045 0.945,0.11 L0.945,0.60
                 C0.945,0.70 0.905,0.775 0.80,0.85 L0.545,0.975
                 C0.515,0.992 0.485,0.992 0.455,0.975 L0.20,0.85
                 C0.095,0.775 0.055,0.70 0.055,0.60 Z"/>
      </clipPath>
    </defs>
  </svg>

  <div class="card" id="card">
    <div class="player"><img src="assets/photo-cut.png" alt="Teoh Jun Hong"></div>

    <div class="rating">
      <span class="ovr">83</span>
      <span class="pos">DEV</span>
      <span class="rule"></span>
      <span class="flag nation"><img src="assets/my-flag.png" alt="nation"></span>
      <span class="flag"><img src="assets/um-logo.png" alt="club"></span>
    </div>

    <div class="name">Teoh Jun Hong</div>

    <div class="stats">
      <div class="col">
        <div class="stat"><b>85</b><span>JAV</span></div>
        <div class="stat"><b>82</b><span>PRB</span></div>
        <div class="stat"><b>74</b><span>WEB</span></div>
      </div>
      <div class="vrule"></div>
      <div class="col">
        <div class="stat"><b>70</b><span>PYT</span></div>
        <div class="stat"><b>80</b><span>NET</span></div>
        <div class="stat"><b>88</b><span>GRT</span></div>
      </div>
    </div>

    <div class="foot">@TJH3281</div>
  </div>
</body>
</html>
